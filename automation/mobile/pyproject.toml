[project]
name = "mobile-automation"
version = "0.1.0"
description = "Appium + Python mobile automation (Android, iOS, Flutter)"
requires-python = ">=3.11"
dependencies = [
    "Appium-Python-Client>=4.0.0",
    "selenium>=4.20.0",
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-rerunfailures>=14.0",
    "pytest-timeout>=2.3.0",
    "allure-pytest>=2.13.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "appium-flutter-finder>=0.3.0",
    "requests>=2.31.0",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Recon scripts are one-off discovery tools (qa/shared/recon-*.md), not part of the harness.
extend-exclude = ["scripts/recon"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# The harness's own packages — also the ones that do not exist yet (pages of step 5).
known-first-party = ["config", "fixtures", "helpers", "pages", "screens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    # A run worth keeping goes through scripts/run.sh (results/<platform>/<date>-<name>/); a plain
    # `pytest` lands here and is wiped by the next one.
    "--alluredir=results/_scratch",
    "--clean-alluredir",
]
markers = [
    "smoke: critical smoke tests",
    "regression: full regression suite",
    "shared: cross-platform tests, run on every --platform",
    "android: runs only with --platform=android (deselected otherwise)",
    "ios: runs only with --platform=ios (deselected otherwise)",
    "flutter: test specific to a Flutter build; runs only when APP_KIND=flutter (deselected otherwise)",
    "quarantine: parked flaky/blocked-by-defect test — MUST carry a BUG id in the reason; excluded from CI gates via -m \"... and not quarantine\" (GATES.md quarantine register)",
    "chk(id): checklist item this test proves, e.g. chk('CHK-AUTH-001'); several ids = several args; read by automation/tools/trace_results.py",
    "tc(id): the one test case this test implements, e.g. tc('TC-AUTH-005') — qa/mobile/<NN-module>/<module>-test-cases.md",
    "e2e: long end-to-end flow — its screen video is always kept (EVIDENCE_VIDEO=auto)",
]
