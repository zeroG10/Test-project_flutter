[project]
name = "qa-tools"
version = "0.1.0"
description = "QA tooling: sync checklists to Google Sheets, close traceability from run results"
requires-python = ">=3.11"
dependencies = [
    "gspread>=6.0",
    "markdown-it-py>=3.0",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# HTML/CSS templates are one long line by nature (the same rule as the web report generators)
"mobile_summary.py" = ["E501"]
"mobile_client_report.py" = ["E501"]
"mobile_combined_report.py" = ["E501"]
"tests/test_trace_results.py" = ["E501"]
