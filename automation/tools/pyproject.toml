[project]
name = "qa-tools"
version = "0.1.0"
description = "QA tooling: sync checklists to Google Sheets, close traceability from run results"
requires-python = ">=3.11"
dependencies = [
    "gspread>=6.0",
    "markdown-it-py>=3.0",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
