# ============================================================================
# PROJECT MANIFEST — single source of truth for project-specific values.
#
# When starting a new project from this template:
#   1. Fill in every <PLACEHOLDER> below (or leave it — the /setup-project
#      skill will ask you for missing values interactively).
#   2. Run /setup-project. It propagates these values into every consumer
#      file listed in setup/SETUP.md and verifies the integrations.
#
# AI agents: NEVER guess a value that is still a <PLACEHOLDER> — ask the user.
# This file is committed (it contains no secrets). Secrets go into the
# .env files and .secrets/ folders listed in setup/SETUP.md.
# ============================================================================

# Version of the TEMPLATE this clone was made from (setup/SETUP.md §6 — how to pull
# template updates into a clone). Bump only when syncing with upstream.
template_version: "1.1.1"

project:
  name: "Concert Technologies — Flutter App"
  repo_name: "<repo-name>"
  description: "<one line: what is automated, for which product, which stacks>"

# ----------------------------------------------------------------------------
# PROJECT PROFILE — answers of prompts/00-discovery.md (Step 0 of /setup-project).
# These select the route through the template (see the routes table in that prompt).
# `<unknown>` is allowed and blocks only the steps that depend on it. Never guessed.
# ----------------------------------------------------------------------------
context:
  product_state: "existing-reachable"          # апка в проді, клієнт користується, DEV доступний
  sources_of_truth:                  # available sources; default precedence is by layer, not list order
    - "srs-prd"
    - "design"                       # Figma
    - "live-product-only"            # жива апка — тільки для discovery, не як доказ коректності
  precedence_note: "<default by layer, or owner override: source + scope + reason + owner/date; link docs/notes/decisions.md>"
  shared_backend: "<which platforms share one backend, or none>"
  first_module: "<module slug — and why it is first: risk / release date / client ask>"
  auth:
    method: "mixed"                 # email+пароль, далі OTP (email або SMS); на DEV код захардкоджений
    roles: ["<role1>", "<role2>"]
    test_accounts: "exist — надані власником проекту"
  test_data:
    policy: "free"                   # DEV: будь-які тести, створення й видалення даних дозволені
    reset: "<seed script / scheduled reset / none>"
  environments:
    target: "dev"                     # automation target, never production
    ci_reachable: "<yes|vpn-required|unknown>"
  reporting: "both"                 # markdown = джерело правди, Google Sheets = таблиця команди
  decision_owner: "<who answers open questions and typical turnaround>"

# Bug tracker — read by prompts/08-file-bug.md. `none` = bugs stay in qa/*/bugs/ markdown.
tracker:
  system: "<jira|linear|gitlab|redmine|none>"
  base_url: "<https://…>"
  project_key: "<KEY>"
  access: "<rest-api key outside the repo|browser session|paste text to the engineer>"
  language: "en"
  environment_names: "<the team's own names, e.g. DEV / stage / prod>"
  etalon_ticket: "<link to one well-written existing ticket, or none>"
  field_defaults: "<issue type, initial status, priority scale, component → assignee, sprint rule, watchers>"
  filing_confirmed_by: "<who says go before anything is created — doctrine rule 5>"

# Which test stacks this project actually uses. Every stack ships wired in the template
# (web = Playwright, mobile = Appium for Android / iOS / Flutter, api = httpx+pytest);
# set the unused ones to false — /setup-project then skips their configuration and CI
# can be trimmed (setup/SETUP.md §2). Leave the folders in place.
platforms:
  web: false
  mobile: true
  api: false                 # окремого набору API-тестів НЕ робимо; API — лише підготовка даних,
                             # логін в обхід OTP і звірка результатів усередині UI-сценаріїв

# Optional QA modules — toggle what this project needs. /setup-project skips
# disabled modules entirely (no config, no verify) and offers to delete their
# scaffold folders from the clone. See setup/SETUP.md §2b for what each enables.
modules:
  load_testing: false        # k6 smoke→load→stress in automation/load/ (needs platforms.api)
  visual_regression: false   # Playwright screenshot baselines + BASELINES.md governance (needs platforms.web)
  security: false            # headers/CORS + IDOR matrix in automation/api/tests/security/ + OWASP checklist (needs platforms.api)
  exploratory: true          # SBTM chartered sessions in qa/<platform>/<NN-module>/exploratory/
  compatibility: true        # tiered device/browser matrix in qa/shared/device-matrix/
  localization: false        # i18n/RTL sweeps — no scaffold yet (planned)

web:
  base_url: "<https://app.example.com>"   # dev/staging target, never production
  figma:
    file_key: "<FIGMA_FILE_KEY>"         # https://www.figma.com/design/<FIGMA_FILE_KEY>/<slug>
    file_name: "<Figma file name>"
    main_page_node: "<0:1>"              # page with the screens; node-ids go to docs/designs/web/figma-sources.md

mobile:
  kind: "flutter"                       # APP_KIND=flutter в automation/mobile/.env
  android:
    app_package: "com.concerttechnologies.app.dev"        # flavor development; prod = com.ctfieldservices.app
    app_activity: "com.concerttechnologies.app.MainActivity"
  ios:
    bundle_id: "com.concerttechnologies.app.dev"           # flavor development; prod = com.ctfieldservices.app
  figma:
    file_key: "eAb4RANWzBFgqiyiA5hUZ0"
    file_name: "Concert Technologies: Mobile app (For review)"
    main_page_node: "2451:73252"        # canvas "Design Mobile app"; Light=2451:82536, Dark=2451:83876

api:
  base_url: "https://copsfieldservices.devapi.concerttech.com"  # COPS Field Services (NestJS); спека в docs/api/openapi.json
  env_label: "dev"                      # used in reports

# Google Sheets that the checklist sync publishes into.
# IDs come from the sheet URL: docs.google.com/spreadsheets/d/<THIS_PART>/edit
# Column letters depend on the sheet layout — see automation/tools/README.md.
sheets:
  web:
    sheet_id: "<WEB_SHEET_ID>"
    worksheet: "Check-list"
    id_col: "O"
    obsolete_col: "P"
  mobile:
    sheet_id: "1HX1obTdusEYgDQjR6NCwdxjNVkj-8eZKsHOiSRxbvsg"
    worksheet: "Check-list"
    id_col: "N"
    obsolete_col: "O"

# Integration prerequisites — /setup-project checks these and reports status.
# Values here are pointers/instructions, not secrets.
integrations:
  figma_mcp:
    server: "figma"                     # project-local MCP server in .mcp.json
    auth: "Set FIGMA_PERSONAL_ACCESS_TOKEN in your shell env (PAT from figma.com/settings)"
  google_sheets:
    auth: "Service-account JSON at automation/tools/.secrets/credentials.json (gitignored). Share each sheet with the service-account email as Editor."
  playwright_mcp:
    server: "playwright"                # project-local MCP server in .mcp.json, no auth needed
  mobile_mcp:
    server: "mobile"                    # project-local MCP server in .mcp.json; needs a booted simulator/emulator + Xcode / Android SDK
