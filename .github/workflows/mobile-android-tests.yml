name: Mobile Tests — Android (Appium)

on:
  pull_request:
    paths:
      - 'automation/mobile/**'
      - '.github/workflows/mobile-android-tests.yml'
  push:
    branches: [main]
    paths:
      - 'automation/mobile/**'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: automation/mobile
    strategy:
      fail-fast: false
      matrix:
        api-level: [34]
        target: [google_apis]
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node (for Appium)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium + UiAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Download APK
        # TODO: replace with your real APK source (build job artifact, S3, Firebase App Distribution, etc.)
        run: |
          mkdir -p builds
          echo "Place app-debug.apk in automation/mobile/builds/android/ via build job or external source"
          # Example: aws s3 cp s3://artifacts/${{ github.sha }}/app-debug.apk builds/android/app-debug.apk
          exit 1  # Remove this when APK source is configured

      - name: Start Appium server
        run: |
          appium --address 127.0.0.1 --port 4723 --log-level warn > appium.log 2>&1 &
          sleep 5

      - name: Run Android tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          working-directory: automation/mobile
          script: |
            cp .env.example .env
            uv run pytest --platform=android -m "smoke and not quarantine" --tb=short

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-allure-results
          path: automation/mobile/allure-results/
          retention-days: 14

      - name: Upload Appium log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-appium-log
          path: automation/mobile/appium.log
          retention-days: 7

  verdict:
    # The ONLY job branch protection should require (see .github/GATES.md).
    # GitHub counts a SKIPPED job as a passing required check — this job runs always
    # and converts "didn't run" / "cancelled" into red. Blocked is never green.
    needs: [android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate verdict
        run: |
          result="${{ needs.android.result }}"
          echo "android job result: $result"
          if [ "$result" != "success" ]; then
            echo "::error::Gate G-3 (mobile-android) is red: android job result is '$result'."
            exit 1
          fi
