name: Web Tests (Playwright)

on:
  pull_request:
    paths:
      - 'automation/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-tests.yml'
  push:
    branches: [main]
    paths:
      - 'automation/web/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: "Preflight: target and primary credentials configured"
        # GATES.md rule 2 — Blocked is never green. With no target the config
        # throws anyway, and without credentials the `setup` project throws — but
        # say WHY before a single browser starts: an unset repository variable or
        # secret is an environment problem, not a test failure.
        env:
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
          APP_USER_EMAIL: ${{ secrets.APP_USER_EMAIL }}
          APP_USER_PASSWORD: ${{ secrets.APP_USER_PASSWORD }}
        run: |
          if [ -z "$WEB_BASE_URL" ]; then
            echo "::error::Repository variable WEB_BASE_URL is empty (Settings → Secrets and variables → Actions → Variables). Gate G-1 has no target — Blocked, not green (GATES.md rule 2)."
            exit 1
          fi
          if [ -z "$APP_USER_EMAIL" ] || [ -z "$APP_USER_PASSWORD" ]; then
            echo "::error::Secrets APP_USER_EMAIL / APP_USER_PASSWORD are not set (Settings → Secrets and variables → Actions → Secrets). The authenticated projects cannot sign in — Blocked, not green (GATES.md rule 2). See .github/workflows/README.md."
            exit 1
          fi
          echo "target: $WEB_BASE_URL (primary account: set)"

      - name: Run Playwright tests
        # Gate G-1 = the gate browsers named in playwright.config.ts: the authenticated
        # projects (chromium, firefox — their `setup` dependency runs automatically) and
        # the public ones (chromium-public, firefox-public: login, forgot-password, smoke).
        # `webkit` is outside the gate by default (config §4) — add it here AND to
        # GATES.md when the SRS names Safari. The `visual` project is the optional
        # visual_regression module with its own baseline governance and is explicitly
        # out of scope for gate G-1. `map-health` is a harness check, run on demand.
        # `@quarantine`: tests parked with a BUG id (GATES.md rule 3 + quarantine register)
        # are excluded here so a known flake cannot vote; they still run locally.
        run: >
          npx playwright test --config=automation/web/playwright.config.ts
          --project=chromium --project=firefox
          --project=chromium-public --project=firefox-public
          --grep-invert @quarantine
        env:
          CI: true
          BASE_URL: ${{ vars.WEB_BASE_URL }}
          # Primary role — required (tests/auth.setup.ts fails loudly without it).
          APP_USER_EMAIL: ${{ secrets.APP_USER_EMAIL }}
          APP_USER_PASSWORD: ${{ secrets.APP_USER_PASSWORD }}
          # Second role — optional: set both secrets or neither (half-set = config error).
          APP_MANAGER_EMAIL: ${{ secrets.APP_MANAGER_EMAIL }}
          APP_MANAGER_PASSWORD: ${{ secrets.APP_MANAGER_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: automation/web/playwright/playwright-report/
          retention-days: 14

      - name: Upload JSON results (input for trace_results.py)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-json
          path: automation/web/playwright/test-results/results.json
          retention-days: 14

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: automation/web/playwright/test-results/
          retention-days: 7

  verdict:
    # The ONLY job branch protection should require (see .github/GATES.md).
    # GitHub counts a SKIPPED job as a passing required check — this job runs always
    # and converts "didn't run" / "cancelled" into red. Blocked is never green.
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate verdict
        run: |
          result="${{ needs.test.result }}"
          echo "test job result: $result"
          if [ "$result" != "success" ]; then
            echo "::error::Gate G-1 (web) is red: test job result is '$result'."
            exit 1
          fi
